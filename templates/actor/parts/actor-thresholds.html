<section class="grid grid-4col actor-thresholds-outline">

    <div class="center grid grid-1col">
        <br />
        <label class="resource-label center-align">Current</label>     
        <label class="resource-label center-align">Total / Threshold</label>
    </div>

    <section class="hypermall-container">
        <div class="hypermall-header">
            <label class="resource-label center-align" for="hypermall-meater">Meat</label>
        </div>

        <div id="hypermall-meat" class="center grid grid-1col">
            <div class="hypermall-effective-field-wrapper" title="Effective value shown; click to edit base value">
                <textarea class="hypermall-thresholds-input hypermall-meat-indicator hypermall-base-input-with-overlay" name="system.meat.value"
                    data-dtype="Number">{{sourceSystem.meat.value}}</textarea>
                <span class="hypermall-effective-overlay" aria-hidden="true">{{system.meat.value}}</span>
            </div>
            <div class="hypermall-effective-field-wrapper" title="Effective value shown; click to edit base value">
                <textarea class="hypermall-thresholds-max hypermall-mt-indicator hypermall-base-input-with-overlay" name="system.meat.max"
                    data-dtype="Number">{{sourceSystem.meat.max}}</textarea>
                <span class="hypermall-effective-overlay" aria-hidden="true">{{system.meat.max}}</span>
            </div>
        </div>
    </section>

    <section class=" hypermall-container">

        <div class="hypermall-header">
            <label class="resource-label center-align " for="hypermall-stresshold">Stress</label>
        </div>

        <div id="hypermall-stress" class="grid grid-1col">
            <div class="hypermall-effective-field-wrapper" title="Effective value shown; click to edit base value">
                <textarea class="hypermall-thresholds-input hypermall-stress-indicator hypermall-base-input-with-overlay" name="system.stress.value"
                    data-dtype="Number">{{sourceSystem.stress.value}}</textarea>
                <span class="hypermall-effective-overlay" aria-hidden="true">{{system.stress.value}}</span>
            </div>
            <div class="hypermall-effective-field-wrapper" title="Effective value shown; click to edit base value">
                <textarea class="hypermall-thresholds-max hypermall-st-indicator hypermall-base-input-with-overlay" name="system.stress.max"
                    data-dtype="Number">{{sourceSystem.stress.max}}</textarea>
                <span class="hypermall-effective-overlay" aria-hidden="true">{{system.stress.max}}</span>
            </div>
        </div>
    </section>
    <section class=" hypermall-container">

        <div class="hypermall-header">
            <label class="resource-label center-align" for="hypermall-debter" {{#if debtIsNegative}}style="color: black;"{{/if}}>Debt</label>
        </div>

        <div id="hypermall-debt" class="grid grid-1col">
            <div class="hypermall-effective-field-wrapper" title="Effective value shown; click to edit base value">
                <textarea class="hypermall-thresholds-input hypermall-debt-indicator hypermall-base-input-with-overlay" name="system.debt.value"
                    data-dtype="Number">{{sourceSystem.debt.value}}</textarea>
                <span class="hypermall-effective-overlay" aria-hidden="true">{{system.debt.value}}</span>
            </div>
            <div class="hypermall-effective-field-wrapper" title="Effective value shown; click to edit base value">
                <textarea class="hypermall-thresholds-max hypermall-dt-indicator hypermall-base-input-with-overlay" name="system.debt.max"
                    data-dtype="Number">{{sourceSystem.debt.max}}</textarea>
                <span class="hypermall-effective-overlay" aria-hidden="true">{{system.debt.max}}</span>
            </div>
        </div>
        {{#if showLoanDefault}}
        <div class="center">
            <label class="resource-label">Loan Default: {{LoanDefault}}</label>
        </div>
        {{/if}}
    </section>
    <div class="grid grid-1col center">
        <div class="grid grid-2col center">
            <label class="resource-label center-align" for="system.armour">Armour</label>
            <div class="hypermall-effective-field-wrapper" title="Effective value shown; click to edit base value">
                <input type="number" class="hypermall-base-input-with-overlay" name="system.armour" value="{{sourceSystem.armour}}" data-dtype="Number" />
                <span class="hypermall-effective-overlay" aria-hidden="true">{{system.armour}}</span>
            </div>
        </div>
    </div>
    <div class="center">
        <button type="button" class="hypermall-resurrection">Resurrect</button>
    </div>
    <div class="center">
        <button type="button" class="hypermall-stress-break">Stress Break</button>
    </div>
    <div class="center">
        <button type="button" class="hypermall-loan-default">Loan Default</button>
    </div>
</section>
