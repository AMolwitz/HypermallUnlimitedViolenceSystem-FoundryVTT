<ol class="items-list">
    <li class='item flexrow items-header'>
        <div class='item-name'>{{localize 'Name'}}</div>
        <div class="item-prop">{{localize 'MSRP'}}</div>
        <div class="item-prop">{{localize 'Quantity'}}</div>
        <div class="item-prop item-carry-type-header">Carry</div>
        <div class='item-controls'>
            <a class='item-control gear-create' title='Create New Equipment'>
                <i class='fas fa-plus'></i>
                {{localize 'DOCUMENT.New' type='Gear'}}
            </a>
        </div>
    </li>
    {{#each gear as |item id|}}
    <li class='item flexrow' data-item-id='{{item._id}}'>
        <div class="item-name">
            <div class="item-image">
                <img src='{{item.img}}' title='{{item.name}}' width='30' height='30'/>
            </div>
            <h4>{{item.name}}</h4>
        </div>
        <div class="item-prop">{{item.system.price}}</div>
        <div class="item-prop">{{item.system.quantity}}</div>
        <div class="item-prop item-carry-type-cell">
            <select class="gear-carry-type" data-item-id="{{item._id}}">
                <option value="held-1h" {{#if (eq item.system.carryType "held-1h")}}selected{{/if}}>Held 1H</option>
                <option value="held-2h" {{#if (eq item.system.carryType "held-2h")}}selected{{/if}}>Held 2H</option>
                <option value="hardpoint" {{#if (eq item.system.carryType "hardpoint")}}selected{{/if}}>Hardpoint</option>
                <option value="worn" {{#if (eq item.system.carryType "worn")}}selected{{/if}}>Worn</option>
                <option value="stowed" {{#if (eq item.system.carryType "stowed")}}selected{{/if}}>Stowed</option>
                <option value="dropped" {{#if (eq item.system.carryType "dropped")}}selected{{/if}}>Dropped</option>
            </select>
        </div>
        <div class='item-controls'>
            <a class='item-control gear-edit' title='Edit'>
                <i class='fas fa-edit'></i>
            </a>
            <a class='item-control gear-delete' title='Delete'>
                <i class='fas fa-trash'></i>
            </a>
        </div>
    </li>
    {{/each}}
</ol>
