<ol class="items-list">
    <li class='item flexrow items-header'>
        <div class='item-name'>{{localize 'Name'}}</div>
        <div class="item-prop">{{localize 'Description'}}</div>
        <div class='item-controls'>
            <a class='item-control gear-create' title='Create New Equipment'>
                <i class='fas fa-plus'></i>
                {{localize 'DOCUMENT.New' type='Gear'}}
            </a>
        </div>
    </li>
    {{#each gear as |item id|}}
    <li class='item flexrow' data-item-id='{{item._id}}'>
        <div class="item-name">
            <div class="item-image">
                <img src='{{item.img}}' title='{{item.name}}' width='30' height='30'/>
            </div>
            <h4>{{item.name}}</h4>
        </div>
        <div class="item-prop">{{{item.enrichedDescription}}}</div>
        <div class='item-controls'>
            <a class='item-control gear-edit' title='Edit'>
                <i class='fas fa-edit'></i>
            </a>
            <a class='item-control gear-delete' title='Delete'>
                <i class='fas fa-trash'></i>
            </a>
        </div>
    </li>
    {{/each}}
</ol>
