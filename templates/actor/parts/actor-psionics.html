<section>
    <label class="hypermall-header">THINKITUDE + 1, 2, or 3 MEAT DAMAGE.</label>

    <div class="ability flexcol flex-group-center hypermall-container hypermall-rolling">
        <span>Psionic Roller</span>

        <div class="hypermall-roll-selector">
            <label class="resource-label hypermall-roll-label">Meat Damage Modifier: </label>
            <div style="display: flex; align-items: center; gap: 5px;">
                <button type="button" class="hypermall-meat-modifier-decrement" style="width: 30px; height: 30px;">-1</button>
                <input id="hypermall-roll-meat-modifier" type="number" value="1" min="1" max="3" style="width: 60px; text-align: center;" data-dtype="Number" />
                <button type="button" class="hypermall-meat-modifier-increment" style="width: 30px; height: 30px;">+1</button>
            </div>
        </div>

        <button id="hypermall-psionics-roller" class="rollable" type="button">Roll Psionics</button>
    </div>

    <div class="grid grid-2col">
        <div>
            <div class="hypermall-header">
                <label>Psionic Powers</label>
            </div>
            <div class="hypermall-editor-container">
                {{editor
                enrichedPsionics
                target="system.psionics"
                button=true
                engine="prosemirror"
                editable=editable
                collaborate=false}}
            </div>
        </div>
        <div>
            <div class="hypermall-header">
                <label>Psionic Items</label>
            </div>
            <ol class="items-list">
                {{#each psionics as |item id|}}
                <li class='item flexrow' data-item-id='{{item._id}}'>
                    <div class="item-name">
                        <div class="item-image">
                            <img src='{{item.img}}' title='{{item.name}}' width='30' height='30' />
                        </div>
                        <h4>{{item.name}}</h4>
                    </div>
                    <div class="item-prop">{{{item.enrichedDescription}}}</div>
                    <div class='item-controls'>
                        <a class='item-control gear-edit' title='Edit'>
                            <i class='fas fa-edit'></i>
                        </a>
                        <a class='item-control gear-delete' title='Delete'>
                            <i class='fas fa-trash'></i>
                        </a>
                    </div>
                </li>
                {{/each}}
            </ol>
        </div>
    </div>
</section>
