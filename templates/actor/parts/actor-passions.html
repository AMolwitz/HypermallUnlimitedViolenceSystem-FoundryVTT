<section>
    <div class="grid grid-2col">
        <div>
            <div class="hypermall-header">
                <label>Passions</label>
            </div>
            <div class="hypermall-editor-container">
                {{editor
                enrichedPassions
                target="system.passions"
                button=true
                engine="prosemirror"
                editable=editable
                collaborate=false}}
            </div>
        </div>
        <div>
            <div class="hypermall-header">
                <label>Special</label>
            </div>
            <div class="hypermall-editor-container">
                {{editor
                enrichedSpecial
                target="system.special"
                button=true
                engine="prosemirror"
                editable=editable
                collaborate=false}}
            </div>
        </div>
    </div>
</section>
