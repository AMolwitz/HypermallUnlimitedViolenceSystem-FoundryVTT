<form class="{{cssClass}} {{actor.type}} flexcol hypermall hypermall-item" autocomplete="off">
  <header class="sheet-header">
    <img class="profile-img" src="{{item.img}}" data-edit="img" title="{{item.name}}" />
    <div class="header-fields">
      <label for="name" class="resource-label">Name</label>
      <div class="resource-content flexrow flex-center flex-between">
        <input class="hypermall-actor-name" type="text" name="name" value="{{item.name}}"
            data-dtype="String" />
      </div>
      <label for="rank" class="resource-label">Rank</label>
      <input name="system.rank" type="number" value="{{system.rank}}"/>
    </div>
  </header>

  <label for="system.description" class="resource-label">Description</label>
    <div class="hypermall-editor-container">
      {{editor
      enrichedDescription
      target="system.description"
      button=true
      engine="prosemirror"
      editable=editable
      collaborate=false }}
    </div>

  <label for="system.effects" class="resource-label">Effects</label>
  <div class="hypermall-editor-container">
    {{editor
    enrichedEffects
    target="system.effects"
    button=true
    engine="prosemirror"
    editable=editable
    collaborate=false }}
  </div>
</form>
